name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weblion
          POSTGRES_PASSWORD: weblion
          POSTGRES_DB: weblion_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U weblion" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://weblion:weblion@localhost:5432/weblion_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm exec prettier --check "apps/*/src/**/*.{ts,tsx,css}" "apps/api/test/**/*.ts" "packages/*/src/**/*.ts"
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
